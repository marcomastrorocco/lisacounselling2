<section class="section"><div class="container"><form class="contact-form enquiry-form" action="/contact-submit.php" method="post"><input type="hidden" name="enquiry_type" value="NDIS counselling enquiry"><h2>NDIS enquiry form</h2><p>Please do not include detailed health information, an NDIS number or other sensitive documents in this form.</p><div class="form-field"><label for="name">Name</label><input id="name" name="name" autocomplete="name" required></div><div class="form-field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required></div><div class="form-field"><label for="phone">Phone <span class="fine-print">(optional)</span></label><input id="phone" name="phone" type="tel" autocomplete="tel"></div><div class="form-field"><label for="enquiry-for">Who is this enquiry for?</label><select id="enquiry-for" name="enquiry_for" required><option value="" selected disabled>Select an option</option><option>Myself</option><option>Someone I support</option></select></div><div class="form-field"><label for="plan-management">Plan-management arrangement</label><select id="plan-management" name="plan_management" required><option value="" selected disabled>Select an option</option><option>Self-managed</option><option>Plan-managed</option><option>I’m not sure</option></select></div><div class="form-field"><label for="contact-preference">Preferred contact method</label><select id="contact-preference" name="contact_preference" required><option value="" selected disabled>Select an option</option><option>Email</option><option>Phone</option><option>Either</option></select></div><div class="form-field"><label for="message">How can we help?</label><textarea id="message" name="message" required></textarea></div><button class="button" type="submit">Submit NDIS Enquiry</button></form></div></section>
