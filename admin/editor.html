<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="dark">
<title>Page editor — SPES Console</title>
<link rel="icon" href="/admin/favicon.ico">
<link rel="stylesheet" href="/admin/app.css">
</head>
<body>
<header class="editor-top">
  <p class="eyebrow">SPES Console · Page editor</p>
  <a class="btn small" href="/admin/">← Dashboard</a>
</header>

<div class="editor-layout">
  <aside class="editor-rail">
    <p class="eyebrow" style="padding:0 10px 9px">Website pages</p>
    <nav id="pages"></nav>
  </aside>

  <div class="editor-split">
    <main class="editor-body">
      <p class="eyebrow">Editing live files</p>
      <h1 id="title">Edit page</h1>
      <p class="intro">Change any field below and watch the page beside it change with you. Nothing reaches the website until you press Save changes.</p>

      <div class="editor-bar">
        <input class="field-filter" id="filter" type="search" placeholder="Filter fields…" autocomplete="off">
        <span class="status" id="status">Loading page…</span>
        <span class="spacer"></span>
        <button class="btn small" id="preview-toggle" type="button" aria-pressed="true">Hide preview</button>
        <button class="btn primary" id="save" type="button" disabled>Save changes <kbd>Ctrl S</kbd></button>
      </div>

      <form id="fields" autocomplete="off">
        <div class="field"><div class="skeleton loading-line" style="width:38%"></div><div class="skeleton loading-line" style="height:60px"></div></div>
        <div class="field"><div class="skeleton loading-line" style="width:52%"></div><div class="skeleton loading-line" style="height:60px"></div></div>
      </form>
    </main>

    <section class="editor-preview" id="preview" aria-label="Live preview of this page">
      <div class="preview-bar">
        <span class="eyebrow">Live preview</span>
        <code class="preview-path" id="preview-path">…</code>
        <span class="spacer"></span>
        <div class="preview-widths" role="group" aria-label="Preview width">
          <button class="chip" id="width-wide" type="button" data-width="wide" aria-pressed="true">Desktop</button>
          <button class="chip" id="width-narrow" type="button" data-width="narrow" aria-pressed="false">Phone</button>
        </div>
        <button class="btn small" id="preview-reload" type="button" title="Fetch the page again as the website is serving it">Reload</button>
      </div>
      <div class="preview-stage" id="preview-stage" data-width="wide">
        <iframe id="preview-frame" title="The page as visitors see it"></iframe>
        <p class="preview-note" id="preview-note" hidden></p>
      </div>
    </section>
  </div>
</div>

<div class="backdrop" id="media-sheet" hidden>
  <div class="sheet wide" role="dialog" aria-modal="true" aria-labelledby="ml-title">
    <header class="sheet-head">
      <h2 id="ml-title">Choose an image</h2>
      <button class="toggle" id="ml-close" type="button">Close</button>
    </header>
    <div class="sheet-body">
      <input class="field-filter" id="ml-filter" type="search" placeholder="Filter by file name…" autocomplete="off">
      <div class="media-picker" id="ml-grid"></div>
    </div>
    <footer class="sheet-foot">
      <span class="status" id="ml-status"></span>
      <button class="btn" id="ml-cancel" type="button">Cancel</button>
      <button class="btn primary" id="ml-use" type="button" disabled>Use this image</button>
    </footer>
  </div>
</div>

<script src="/admin/editor.js"></script>
</body>
</html>
